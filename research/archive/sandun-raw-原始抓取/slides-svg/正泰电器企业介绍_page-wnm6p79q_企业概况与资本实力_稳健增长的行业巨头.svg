<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720">
  <defs>
    <style><![CDATA[
      @import url("https://content-sandunppt.oss-cn-guangzhou.aliyuncs.com/fonts/HarmonyOS_Sans_SC_Bold/result.css");
      @import url("https://content-sandunppt.oss-cn-guangzhou.aliyuncs.com/fonts/HarmonyOS_Sans_SC_Regular/result.css");
      @import url("https://content-sandunppt.oss-cn-guangzhou.aliyuncs.com/fonts/SourceHanSerifCN-Bold/result.css");
      .ppt-font-cn-heading { font-family: 'HarmonyOS Sans SC'; font-weight: 700; }
      .ppt-font-cn-body { font-family: 'HarmonyOS Sans SC'; font-weight: 400; }
      .ppt-font-cn-theme-heritage { font-family: 'Source Han Serif CN'; font-weight: 700; }
    ]]></style>
    <filter id="card_shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#064E3B" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- LAYER 1: Background (Eco-Fluid) -->
  <g id="bg">
    <defs>
      <linearGradient id="eco_grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F0FDF4"/>
        <stop offset="100%" stop-color="#FFFFFF"/>
      </linearGradient>
      <filter id="blur_blob">
        <feGaussianBlur in="SourceGraphic" stdDeviation="60" result="blur"/>
      </filter>
    </defs>
    <rect width="100%" height="100%" fill="url(#eco_grad)"/>
    <circle cx="10%" cy="20%" r="300" fill="#DCFCE7" filter="url(#blur_blob)" opacity="0.6"/>
    <circle cx="90%" cy="80%" r="400" fill="#F0FDFA" filter="url(#blur_blob)" opacity="0.8"/>
    <path d="M0 0 Q480 20 960 0 T1920 0" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.2"/>
  </g>

  <!-- LAYER 2: Content Layer -->
  <g id="content_layer">
    <!-- Card 1: Revenue & Assets -->
    <g transform="translate(40, 100)" filter="url(#card_shadow)">
      <rect width="380" height="280" rx="16" fill="#FFFFFF" stroke="#DCFCE7" stroke-width="1.5"/>
      <text class="ppt-font-cn-heading" x="24" y="40" font-size="18" fill="#065F46">营收规模与资产实力</text>
      
      <text class="ppt-font-cn-heading" x="24" y="95" font-size="42" fill="#10B981">645.19 <tspan font-size="18" fill="#064E3B">亿元</tspan></text>
      <text class="ppt-font-cn-body" x="24" y="120" font-size="14" fill="#374151">2024年营业收入 (同比增长 12.7%)</text>
      
      <text class="ppt-font-cn-heading" x="24" y="185" font-size="42" fill="#064E3B">1,449.58 <tspan font-size="18" fill="#064E3B">亿元</tspan></text>
      <text class="ppt-font-cn-body" x="24" y="210" font-size="14" fill="#374151">2025年Q1总资产 (持续扩张中)</text>
      
      <rect x="24" y="235" width="332" height="1" fill="#DCFCE7"/>
      <text class="ppt-font-cn-body" x="24" y="260" font-size="15" fill="#065F46">海外市场收入：<tspan class="ppt-font-cn-heading" fill="#10B981">100.48 亿元</tspan> (+21.53%)</text>
    </g>

    <!-- Card 2: Profit & Growth -->
    <g transform="translate(440, 100)" filter="url(#card_shadow)">
      <rect width="800" height="280" rx="16" fill="#FFFFFF" stroke="#DCFCE7" stroke-width="1.5"/>
      <text class="ppt-font-cn-heading" x="24" y="40" font-size="18" fill="#065F46">盈利质量与增长动能</text>
      
      <g transform="translate(24, 70)">
          <text class="ppt-font-cn-body" x="0" y="0" font-size="14" fill="#374151">2025 Q1-Q3 归母净利润趋势 (单位: 亿元)</text>
          <g data-chart-slot-id="chart-1" data-chart-type="bar" transform="translate(0, 20)"><rect x="0.75" y="0.75" width="458.5" height="158.5" rx="19.25" fill="none" stroke="#DCFCE7" stroke-width="1.5"/><line x1="50" y1="120" x2="440" y2="120" stroke="#F0FDF4" stroke-width="1" stroke-dasharray="4 4"/><text x="38" y="124" text-anchor="end" font-size="10" fill="#64748B" opacity="0.8" font-weight="500">0</text><line x1="50" y1="102" x2="440" y2="102" stroke="#F0FDF4" stroke-width="1" stroke-dasharray="4 4"/><text x="38" y="106" text-anchor="end" font-size="10" fill="#64748B" opacity="0.8" font-weight="500">10</text><line x1="50" y1="84" x2="440" y2="84" stroke="#F0FDF4" stroke-width="1" stroke-dasharray="4 4"/><text x="38" y="88" text-anchor="end" font-size="10" fill="#64748B" opacity="0.8" font-weight="500">20</text><line x1="50" y1="66" x2="440" y2="66" stroke="#F0FDF4" stroke-width="1" stroke-dasharray="4 4"/><text x="38" y="70" text-anchor="end" font-size="10" fill="#64748B" opacity="0.8" font-weight="500">30</text><line x1="50" y1="48" x2="440" y2="48" stroke="#F0FDF4" stroke-width="1" stroke-dasharray="4 4"/><text x="38" y="52" text-anchor="end" font-size="10" fill="#64748B" opacity="0.8" font-weight="500">40</text><line x1="50" y1="30" x2="440" y2="30" stroke="#F0FDF4" stroke-width="1" stroke-dasharray="4 4"/><text x="38" y="34" text-anchor="end" font-size="10" fill="#64748B" opacity="0.8" font-weight="500">50</text><path d="M 56 120 L 56 66.63999999999999 A 10 10 0 0 1 66 56.63999999999999 L 164 56.63999999999999 A 10 10 0 0 1 174 66.63999999999999 L 174 120 Z" fill="#10B981"/><text x="115" y="48.63999999999999" text-anchor="middle" font-size="14" fill="#064E3B" font-weight="600">35.2亿元</text><text x="115" y="144" text-anchor="middle" font-size="12" fill="#64748B" font-weight="500">2023</text><path d="M 186 120 L 186 60.7 A 10 10 0 0 1 196 50.7 L 294 50.7 A 10 10 0 0 1 304 60.7 L 304 120 Z" fill="#34D399"/><text x="245" y="42.7" text-anchor="middle" font-size="14" fill="#064E3B" font-weight="600">38.5亿元</text><text x="245" y="144" text-anchor="middle" font-size="12" fill="#64748B" font-weight="500">2024</text><path d="M 316 120 L 316 54.778000000000006 A 10 10 0 0 1 326 44.778000000000006 L 424 44.778000000000006 A 10 10 0 0 1 434 54.778000000000006 L 434 120 Z" fill="#059669"/><text x="375" y="36.778000000000006" text-anchor="middle" font-size="14" fill="#064E3B" font-weight="600">41.79亿元</text><text x="375" y="144" text-anchor="middle" font-size="12" fill="#64748B" font-weight="500">2025 Q1-Q3</text><line x1="42" y1="120" x2="440" y2="120" stroke="#A7F3D0" stroke-width="1.2" stroke-linecap="round"/><line x1="50" y1="30" x2="50" y2="128" stroke="#A7F3D0" stroke-width="1.2" stroke-linecap="round"/></g>
      </g>
      
      <g transform="translate(510, 70)">
          <rect width="266" height="85" rx="12" fill="#ECFDF5"/>
          <text class="ppt-font-cn-heading" x="20" y="38" font-size="28" fill="#059669">+19.49%</text>
          <text class="ppt-font-cn-body" x="20" y="62" font-size="14" fill="#065F46">2025年前三季度净利润增速</text>
          
          <rect y="100" width="266" height="85" rx="12" fill="#F0FDF4"/>
          <text class="ppt-font-cn-heading" x="20" y="138" font-size="28" fill="#064E3B">152.02 <tspan font-size="14">亿</tspan></text>
          <text class="ppt-font-cn-body" x="20" y="162" font-size="14" fill="#065F46">2024经营性现金流 (同比激增267%)</text>
      </g>
    </g>

    <!-- Card 3: Business Matrix -->
    <g transform="translate(40, 400)" filter="url(#card_shadow)">
      <rect width="800" height="280" rx="16" fill="#FFFFFF" stroke="#DCFCE7" stroke-width="1.5"/>
      <text class="ppt-font-cn-heading" x="24" y="40" font-size="18" fill="#065F46">双翼齐飞的业务格局</text>
      
      <g transform="translate(24, 70)">
          <image id="ai-image-img-1" data-ai-slot-id="img-1" x="0" y="0" width="300" height="180" href="https://images.unsplash.com/photo-1685441231708-57b50d455289?crop=entropy&amp;cs=tinysrgb&amp;fit=max&amp;fm=jpg&amp;ixid=M3w4ODI2MTl8MHwxfHNlYXJjaHwxfHxnbG9iYWwlMjByZW5ld2FibGUlMjBlbmVyZ3klMjBpbmR1c3RyaWFsJTIwbmV0d29ya3xlbnwwfHx8fDE3NzQzMzA1OTV8MA&amp;ixlib=rb-4.1.0&amp;q=80&amp;w=1080" data-source-url="https://unsplash.com/photos/a-group-of-wind-turbines-on-a-hill-PA0AxqW6pR0?utm_medium=referral&amp;utm_source=superppt+agent" preserveAspectRatio="xMidYMid slice" transform="translate(0, 0)"><title>https://unsplash.com/photos/a-group-of-wind-turbines-on-a-hill-PA0AxqW6pR0?utm_medium=referral&amp;utm_source=superppt+agent</title></image>
          
          <g transform="translate(330, 0)">
              <rect width="420" height="85" rx="12" fill="#F0FDF4" stroke="#DCFCE7"/>
              <circle cx="30" cy="42" r="6" fill="#10B981"/>
              <text class="ppt-font-cn-heading" x="50" y="38" font-size="18" fill="#064E3B">智慧电器 (智慧低压)</text>
              <text class="ppt-font-cn-body" x="50" y="62" font-size="14" fill="#374151">营收 217.04 亿，行业龙头地位稳固</text>
              
              <rect y="95" width="420" height="85" rx="12" fill="#F0FDF4" stroke="#DCFCE7"/>
              <circle cx="30" cy="137" r="6" fill="#059669"/>
              <text class="ppt-font-cn-heading" x="50" y="133" font-size="18" fill="#064E3B">绿色能源 (户用光伏)</text>
              <text class="ppt-font-cn-body" x="50" y="157" font-size="14" fill="#374151">新增装机 13GW，市占率多年蝉联第一</text>
          </g>
      </g>
    </g>

    <!-- Card 4: Capital Market -->
    <g transform="translate(850, 400)" filter="url(#card_shadow)">
      <rect width="390" height="280" rx="16" fill="#064E3B" stroke="#065F46" stroke-width="1"/>
      <text class="ppt-font-cn-heading" x="24" y="40" font-size="18" fill="#D1FAE5">资本市场表现与股东回报</text>
      
      <text class="ppt-font-cn-body" x="24" y="80" font-size="14" fill="#A7F3D0">股票代码</text>
      <text class="ppt-font-cn-heading" x="24" y="110" font-size="24" fill="#FFFFFF">601877.SH</text>
      
      <g transform="translate(24, 140)">
          <text class="ppt-font-cn-body" x="0" y="0" font-size="14" fill="#A7F3D0">分红融资比</text>
          <text class="ppt-font-cn-heading" x="0" y="45" font-size="48" fill="#10B981">0.89</text>
          <rect y="65" width="342" height="8" rx="4" fill="#065F46"/>
          <rect y="65" width="304" height="8" rx="4" fill="#10B981"/>
          <text class="ppt-font-cn-body" x="0" y="95" font-size="14" fill="#D1FAE5">累计分红 143.82 亿 / 融资 162.49 亿</text>
      </g>
      
      <text class="ppt-font-cn-body" x="24" y="260" font-size="13" fill="#6EE7B7">入选光伏龙头30、先进制造100核心指数</text>
    </g>
  </g>

  <!-- LAYER 3: Header -->
  <g id="header">
    <circle cx="44" cy="60" r="6" fill="#10B981"/>
    <text class="ppt-font-cn-heading" x="58" y="66" font-size="26" fill="#064E3B">企业概况与资本实力：稳健增长的行业巨头</text>
  </g>

  <g id="ai-image-layer">
    <clipPath id="clip-ai-image-img-1">
      <rect x="0.00" y="0.00" width="300.00" height="180.00" rx="12"/>
    </clipPath>
    
  </g>
</svg>