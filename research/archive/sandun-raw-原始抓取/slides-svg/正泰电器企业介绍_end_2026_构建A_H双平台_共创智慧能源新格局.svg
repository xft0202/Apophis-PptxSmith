<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style><![CDATA[
      @import url("https://content-sandunppt.oss-cn-guangzhou.aliyuncs.com/fonts/HarmonyOS_Sans_SC_Bold/result.css");
      @import url("https://content-sandunppt.oss-cn-guangzhou.aliyuncs.com/fonts/HarmonyOS_Sans_SC_Regular/result.css");
      .ppt-font-cn-heading { font-family: 'HarmonyOS Sans SC'; font-weight: 700; }
      .ppt-font-cn-body { font-family: 'HarmonyOS Sans SC'; font-weight: 400; }
    ]]></style>
    <filter id="card_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="card_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F0FDF4" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- LAYER 1: Background (Eco-Fluid Style) -->
  <g id="bg">
    <defs>
      <linearGradient id="eco_grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F0FDF4"/>
        <stop offset="100%" stop-color="#FFFFFF"/>
      </linearGradient>
      <filter id="blur_blob">
        <feGaussianBlur in="SourceGraphic" stdDeviation="60" result="blur"/>
      </filter>
    </defs>
    <rect width="100%" height="100%" fill="url(#eco_grad)"/>
    <circle cx="10%" cy="20%" r="300" fill="#DCFCE7" filter="url(#blur_blob)" opacity="0.6"/>
    <circle cx="90%" cy="80%" r="400" fill="#F0FDFA" filter="url(#blur_blob)" opacity="0.8"/>
    <path d="M0 0 Q480 20 960 0 T1920 0" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.2"/>
  </g>

  <!-- LAYER 2: Content (End Page Layout) -->
  <g id="content_layer">
    <!-- Center Main Titles -->
    <g transform="translate(640, 240)">
      <text text-anchor="middle" class="ppt-font-cn-heading" font-size="82" fill="#064E3B" y="0">感谢聆听，共鉴未来</text>
      <text text-anchor="middle" class="ppt-font-cn-heading" font-size="30" fill="#10B981" y="65">2026：构建A+H双平台，共创智慧能源新格局</text>
      <text text-anchor="middle" class="ppt-font-cn-body" font-size="22" fill="#475569" y="115">赋能绿色能源新未来 · 智慧低碳协同发展</text>
    </g>

    <!-- Decorative Divider -->
    <g transform="translate(440, 405)">
      <line x1="0" y1="0" x2="400" y2="0" stroke="#10B981" stroke-width="2" stroke-opacity="0.3"/>
      <circle cx="200" cy="0" r="4" fill="#10B981"/>
    </g>

    <!-- Strategic Pillars (Horizontal Summary) -->
    <g transform="translate(190, 470)">
      <!-- Pillar 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="280" height="110" rx="16" fill="url(#card_grad)" filter="url(#card_shadow)"/>
        <rect x="0" y="30" width="4" height="24" rx="2" fill="#10B981"/>
        <text x="25" y="48" class="ppt-font-cn-heading" font-size="22" fill="#064E3B">资本赋能</text>
        <text x="25" y="82" class="ppt-font-cn-body" font-size="16" fill="#475569">A+H双平台协同</text>
        <text x="25" y="102" class="ppt-font-cn-body" font-size="16" fill="#475569">优化资本结构</text>
      </g>
      <!-- Pillar 2 -->
      <g transform="translate(310, 0)">
        <rect x="0" y="0" width="280" height="110" rx="16" fill="url(#card_grad)" filter="url(#card_shadow)"/>
        <rect x="0" y="30" width="4" height="24" rx="2" fill="#10B981"/>
        <text x="25" y="48" class="ppt-font-cn-heading" font-size="22" fill="#064E3B">产业协同</text>
        <text x="25" y="82" class="ppt-font-cn-body" font-size="16" fill="#475569">低压电器 + 光伏</text>
        <text x="25" y="102" class="ppt-font-cn-body" font-size="16" fill="#475569">全生命周期管理</text>
      </g>
      <!-- Pillar 3 -->
      <g transform="translate(620, 0)">
        <rect x="0" y="0" width="280" height="110" rx="16" fill="url(#card_grad)" filter="url(#card_shadow)"/>
        <rect x="0" y="30" width="4" height="24" rx="2" fill="#10B981"/>
        <text x="25" y="48" class="ppt-font-cn-heading" font-size="22" fill="#064E3B">全球领跑</text>
        <text x="25" y="82" class="ppt-font-cn-body" font-size="16" fill="#475569">本土化智造深度</text>
        <text x="25" y="102" class="ppt-font-cn-body" font-size="16" fill="#475569">融入全球供应链</text>
      </g>
    </g>

    <!-- Footer Contact Info -->
    <g transform="translate(640, 660)">
      <text text-anchor="middle" class="ppt-font-cn-heading" font-size="20" fill="#064E3B" y="0">正泰电器股份有限公司 (CHINT ELECTRICS)</text>
      <text text-anchor="middle" class="ppt-font-cn-body" font-size="16" fill="#64748B" y="30">官网：www.chint.net  |  电话：0577-XXXXXXXX  |  中国 · 浙江 · 上海</text>
    </g>
  </g>

  <!-- Decorative Elements -->
  <g opacity="0.3">
    <circle cx="1200" cy="80" r="100" fill="none" stroke="#10B981" stroke-width="1"/>
    <circle cx="1200" cy="80" r="70" fill="none" stroke="#10B981" stroke-width="0.5"/>
    <path d="M50 650 L150 650" stroke="#10B981" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>