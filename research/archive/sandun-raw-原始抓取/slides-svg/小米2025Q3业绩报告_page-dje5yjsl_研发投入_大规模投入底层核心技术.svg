<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style><![CDATA[
      @import url("https://content-sandunppt.oss-cn-guangzhou.aliyuncs.com/fonts/HarmonyOS_Sans_SC_Bold/result.css");
      @import url("https://content-sandunppt.oss-cn-guangzhou.aliyuncs.com/fonts/HarmonyOS_Sans_SC_Regular/result.css");
      .ppt-font-cn-heading { font-family: 'HarmonyOS Sans SC'; font-weight: 700; }
      .ppt-font-cn-body { font-family: 'HarmonyOS Sans SC'; font-weight: 400; }
    ]]></style>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
    <linearGradient id="gradOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6700" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF6700" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="cardDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C2C2C"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
  </defs>

  <!-- LAYER 1: Background -->
  <g id="bg">
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5E5E5" stroke-width="0.5"/>
      </pattern>
      <radialGradient id="glow" cx="90%" cy="90%" r="50%">
        <stop offset="0%" stop-color="#FF6700" stop-opacity="0.08"/>
        <stop offset="100%" stop-color="#FF6700" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="100%" height="100%" fill="#F8F9FA"/>
    <rect width="100%" height="100%" fill="url(#grid)"/>
    <rect width="100%" height="100%" fill="url(#glow)"/>
  </g>

  <!-- LAYER 2: Content -->
  <g id="content_layer">
    <!-- Card 1: R&D Spending (Large Left Card) -->
    <g transform="translate(40, 100)">
      <rect width="760" height="580" rx="20" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <text class="ppt-font-cn-heading" x="30" y="45" font-size="24" fill="#1A1A1A">研发开支：爆发式强度投入</text>
      
      <!-- Key Metric -->
      <text class="ppt-font-cn-body" x="30" y="95" font-size="16" fill="#64748B">同比增速 (YoY Growth)</text>
      <text class="ppt-font-cn-heading" x="30" y="155" font-size="64" fill="#FF6700">+52.1%</text>
      
      <!-- Data Points -->
      <g transform="translate(30, 190)">
        <rect width="335" height="110" rx="16" fill="url(#gradOrange)"/>
        <text class="ppt-font-cn-body" x="24" y="40" font-size="15" fill="#64748B">2025 Q3 单季投入</text>
        <text class="ppt-font-cn-heading" x="24" y="85" font-size="36" fill="#1A1A1A">91 <tspan font-size="20" fill="#1A1A1A">亿元</tspan></text>
        
        <rect x="365" y="0" width="335" height="110" rx="16" fill="url(#gradOrange)"/>
        <text class="ppt-font-cn-body" x="389" y="40" font-size="15" fill="#64748B">2025 前三季度累计</text>
        <text class="ppt-font-cn-heading" x="389" y="85" font-size="36" fill="#1A1A1A">235 <tspan font-size="20" fill="#1A1A1A">亿元</tspan></text>
      </g>

      <!-- Chart Slot 1: Spending Trend -->
      <text class="ppt-font-cn-body" x="30" y="335" font-size="14" fill="#94A3B8">近三个季度研发投入趋势 (单位：亿元)</text>
      <g data-chart-slot-id="chart-1" data-chart-type="bar" transform="translate(30, 350)"><rect x="0.5" y="0.5" width="699" height="199" rx="7.5" fill="none" stroke="#E5E5E5" stroke-width="1"/><line x1="50" y1="160" x2="680" y2="160" stroke="#EEEEEE" stroke-width="1" stroke-dasharray="0"/><text x="38" y="164" text-anchor="end" font-size="11" fill="#64748B" opacity="0.8" font-weight="500">0</text><line x1="50" y1="134" x2="680" y2="134" stroke="#EEEEEE" stroke-width="1" stroke-dasharray="0"/><text x="38" y="138" text-anchor="end" font-size="11" fill="#64748B" opacity="0.8" font-weight="500">20</text><line x1="50" y1="108" x2="680" y2="108" stroke="#EEEEEE" stroke-width="1" stroke-dasharray="0"/><text x="38" y="112" text-anchor="end" font-size="11" fill="#64748B" opacity="0.8" font-weight="500">40</text><line x1="50" y1="82" x2="680" y2="82" stroke="#EEEEEE" stroke-width="1" stroke-dasharray="0"/><text x="38" y="86" text-anchor="end" font-size="11" fill="#64748B" opacity="0.8" font-weight="500">60</text><line x1="50" y1="56" x2="680" y2="56" stroke="#EEEEEE" stroke-width="1" stroke-dasharray="0"/><text x="38" y="60" text-anchor="end" font-size="11" fill="#64748B" opacity="0.8" font-weight="500">80</text><line x1="50" y1="30" x2="680" y2="30" stroke="#EEEEEE" stroke-width="1" stroke-dasharray="0"/><text x="38" y="34" text-anchor="end" font-size="11" fill="#64748B" opacity="0.8" font-weight="500">100</text><path d="M 56 160 L 56 75.6 A 4 4 0 0 1 60 71.6 L 250 71.6 A 4 4 0 0 1 254 75.6 L 254 160 Z" fill="#FF6700"/><text x="155" y="63.599999999999994" text-anchor="middle" font-size="14" fill="#1A1A1A" font-weight="600">68亿元</text><text x="155" y="184" text-anchor="middle" font-size="13" fill="#64748B" font-weight="500">2025 Q1</text><path d="M 266 160 L 266 65.2 A 4 4 0 0 1 270 61.2 L 460 61.2 A 4 4 0 0 1 464 65.2 L 464 160 Z" fill="#333333"/><text x="365" y="53.2" text-anchor="middle" font-size="14" fill="#1A1A1A" font-weight="600">76亿元</text><text x="365" y="184" text-anchor="middle" font-size="13" fill="#64748B" font-weight="500">2025 Q2</text><path d="M 476 160 L 476 45.7 A 4 4 0 0 1 480 41.7 L 670 41.7 A 4 4 0 0 1 674 45.7 L 674 160 Z" fill="#808080"/><text x="575" y="33.7" text-anchor="middle" font-size="14" fill="#1A1A1A" font-weight="600">91亿元</text><text x="575" y="184" text-anchor="middle" font-size="13" fill="#64748B" font-weight="500">2025 Q3</text><line x1="42" y1="160" x2="680" y2="160" stroke="#CCCCCC" stroke-width="1" stroke-linecap="round"/><line x1="50" y1="30" x2="50" y2="168" stroke="#CCCCCC" stroke-width="1" stroke-linecap="round"/></g>
    </g>

    <!-- Card 2: Talent Density (Right Top) -->
    <g transform="translate(820, 100)">
      <rect width="420" height="320" rx="20" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <text class="ppt-font-cn-heading" x="30" y="45" font-size="22" fill="#1A1A1A">人才密度：硬核工程师文化</text>
      
      <text class="ppt-font-cn-body" x="30" y="85" font-size="15" fill="#64748B">研发人员总数</text>
      <text class="ppt-font-cn-heading" x="30" y="125" font-size="42" fill="#1A1A1A">24,871 <tspan font-size="18" fill="#1A1A1A">人</tspan></text>

      <!-- Chart Slot 2: Talent Ratio -->
      <g data-chart-slot-id="chart-2" data-chart-type="pie" transform="translate(135, 130)"><rect x="0.5" y="0.5" width="149" height="149" rx="7.5" fill="none" stroke="#E5E5E5" stroke-width="1"/><path d="M 75 75 L 95.6923344726651 125.95907469795105 A 55 55 0 0 0 75 20 Z" fill="#FF6700" stroke="transparent" stroke-width="2"/><path d="M 75 75 L 74.52004054758946 20.00209423147058 A 55 55 0 1 0 95.24685039765728 126.13770672385382 Z" fill="#333333" stroke="transparent" stroke-width="2"/></g>
      <text class="ppt-font-cn-body" x="210" y="300" text-anchor="middle" font-size="15" fill="#64748B">研发人员占比约 <tspan fill="#FF6700" font-weight="700">44%</tspan></text>
    </g>

    <!-- Card 3: Strategy Slogan (Right Bottom) -->
    <g transform="translate(820, 440)">
      <rect width="420" height="240" rx="20" fill="url(#cardDark)"/>
      <text class="ppt-font-cn-heading" x="30" y="45" font-size="18" fill="#94A3B8">战略驱动：新十年目标</text>
      
      <text class="ppt-font-cn-heading" x="30" y="105" font-size="32" fill="#FFFFFF">全球新一代</text>
      <text class="ppt-font-cn-heading" x="30" y="155" font-size="32" fill="#FFFFFF">硬核科技引领者</text>
      
      <rect x="30" y="185" width="60" height="4" rx="2" fill="#FF6700"/>
      <text class="ppt-font-cn-body" x="30" y="215" font-size="15" fill="#94A3B8">从应用创新迈向底层技术深水区</text>
    </g>
  </g>

  <!-- LAYER 3: Header -->
  <g id="header">
    <rect x="40" y="46" width="6" height="26" rx="3" fill="#FF6700"/>
    <text class="ppt-font-cn-heading" x="58" y="66" font-size="26" fill="#1A1A1A">研发投入：大规模投入底层核心技术</text>
  </g>
</svg>