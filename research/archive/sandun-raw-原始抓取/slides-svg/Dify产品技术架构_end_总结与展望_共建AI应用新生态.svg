<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style><![CDATA[
      @import url("https://content-sandunppt.oss-cn-guangzhou.aliyuncs.com/fonts/HarmonyOS_Sans_SC_Bold/result.css");
      @import url("https://content-sandunppt.oss-cn-guangzhou.aliyuncs.com/fonts/HarmonyOS_Sans_SC_Regular/result.css");
      .ppt-font-cn-heading { font-family: 'HarmonyOS Sans SC'; font-weight: 700; }
      .ppt-font-cn-body { font-family: 'HarmonyOS Sans SC'; font-weight: 400; }
      .en-heading { font-family: 'Arial', sans-serif; font-weight: 700; }
      .text-white { fill: #FFFFFF; }
      .text-blue { fill: #3B82F6; }
      .text-dim { fill: #94A3B8; }
      .glass-card { fill: #FFFFFF; fill-opacity: 0.03; stroke: #FFFFFF; stroke-opacity: 0.1; stroke-width: 1; }
    ]]></style>
    <linearGradient id='grad1' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' style='stop-color:#05070A;stop-opacity:1' />
      <stop offset='100%' style='stop-color:#0C121E;stop-opacity:1' />
    </linearGradient>
    <pattern id='microGrid' width='40' height='40' patternUnits='userSpaceOnUse'>
      <path d='M 40 0 L 0 0 0 40' fill='none' stroke='#344256' stroke-width='0.5' stroke-opacity='0.3'/>
    </pattern>
    <filter id='glow'>
      <feGaussianBlur stdDeviation='50' result='blur'/>
      <feComposite in='SourceGraphic' in2='blur' operator='over'/>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- LAYER 1: Background (Aurora Logic) -->
  <g id='bg'>
    <rect width='100%' height='100%' fill='url(#grad1)'/>
    <rect width='100%' height='100%' fill='url(#microGrid)'/>
    <circle cx='90%' cy='10%' r='300' fill='#1E40AF' fill-opacity='0.15' filter='url(#glow)'/>
    <circle cx='10%' cy='90%' r='250' fill='#4F46E5' fill-opacity='0.1' filter='url(#glow)'/>
  </g>

  <!-- LAYER 2: Content (End Page Layout) -->
  <g id="content_layer">
    
    <!-- Module 1: Core Vision (Centered) -->
    <g transform="translate(640, 180)">
      <text class="ppt-font-cn-heading text-white" text-anchor="middle" font-size="56" filter="url(#textGlow)">总结与展望：共建AI应用新生态</text>
      <text class="ppt-font-cn-body text-blue" y="55" text-anchor="middle" font-size="24" style="letter-spacing: 2px;">赋能每一位开发者，加速企业 AI 生产力变革</text>
      
      <!-- Decorative Line -->
      <g transform="translate(-150, 90)">
        <rect width="300" height="1" fill="url(#lineGrad)" opacity="0.5"/>
        <defs>
          <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
            <stop offset="50%" stop-color="#3B82F6" stop-opacity="1"/>
            <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
          </linearGradient>
        </defs>
      </g>
      
      <!-- Vision Description -->
      <text class="ppt-font-cn-body text-dim" y="130" text-anchor="middle" font-size="18">
        <tspan x="0" dy="0">Dify 持续通过开源力量与技术创新，打破 AI 应用门槛</tspan>
        <tspan x="0" dy="28">在 2026 年，我们将构建一个开放、协同、高效的全球 AI 应用生态</tspan>
      </text>
    </g>

    <!-- Module 2: Call to Action Cards -->
    <g transform="translate(310, 380)">
      <!-- Card 1: Open Source -->
      <g>
        <rect class="glass-card" x="0" y="0" width="320" height="150" rx="12" />
        <rect x="24" y="24" width="40" height="40" rx="8" fill="#3B82F6" fill-opacity="0.1"/>
        <!-- Icon: Code -->
        <path d="M40 36 L34 44 L40 52 M48 36 L54 44 L48 52" stroke="#3B82F6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="ppt-font-cn-heading text-white" x="80" y="51" font-size="22">开源社区</text>
        <text class="ppt-font-cn-body text-dim" x="24" y="95" font-size="15">
          <tspan x="24" dy="0">访问 GitHub 参与项目贡献</tspan>
          <tspan x="24" dy="24">或下载社区版进行本地部署</tspan>
        </text>
      </g>
      
      <!-- Card 2: Enterprise -->
      <g transform="translate(340, 0)">
        <rect class="glass-card" x="0" y="0" width="320" height="150" rx="12" />
        <rect x="24" y="24" width="40" height="40" rx="8" fill="#3B82F6" fill-opacity="0.1"/>
        <!-- Icon: Business -->
        <rect x="34" y="38" width="20" height="14" stroke="#3B82F6" stroke-width="2" fill="none"/>
        <path d="M40 38 V34 H48 V38" stroke="#3B82F6" stroke-width="2" fill="none"/>
        <text class="ppt-font-cn-heading text-white" x="80" y="51" font-size="22">企业咨询</text>
        <text class="ppt-font-cn-body text-dim" x="24" y="95" font-size="15">
          <tspan x="24" dy="0">扫码预约 1 对 1 专家演示</tspan>
          <tspan x="24" dy="24">获取企业私有化部署定制方案</tspan>
        </text>
      </g>
    </g>

    <!-- Module 3: Thank You & Footer -->
    <g transform="translate(640, 620)">
      <text class="en-heading" text-anchor="middle" font-size="100" fill="#FFFFFF" fill-opacity="0.03" style="letter-spacing:15px">THANK YOU</text>
      <text class="ppt-font-cn-heading text-white" y="-10" text-anchor="middle" font-size="32">感谢聆听，共创未来</text>
      
      <g transform="translate(0, 45)">
        <text class="ppt-font-cn-body text-dim" text-anchor="middle" font-size="16">
          <tspan>汇报人：Dify 产品团队</tspan>
          <tspan dx="30" fill-opacity="0.3">|</tspan>
          <tspan dx="30">部门：企业数字化部</tspan>
          <tspan dx="30" fill-opacity="0.3">|</tspan>
          <tspan dx="30">日期：2026年X月X日</tspan>
        </text>
      </g>
    </g>

  </g>

  <!-- No Global Header for End Page as per Rendering Logic Step 2 -->
</svg>