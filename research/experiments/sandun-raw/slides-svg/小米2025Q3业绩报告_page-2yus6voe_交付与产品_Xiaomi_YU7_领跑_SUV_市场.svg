<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720"><style data-img-radius="1">image{clip-path:inset(0 round 8px)}</style>
  <defs>
    <style>
      @import url("https://content-sandunppt.oss-cn-guangzhou.aliyuncs.com/fonts/HarmonyOS_Sans_SC_Bold/result.css");
      @import url("https://content-sandunppt.oss-cn-guangzhou.aliyuncs.com/fonts/HarmonyOS_Sans_SC_Regular/result.css");
      .ppt-font-cn-heading { font-family: 'HarmonyOS Sans SC', sans-serif; font-weight: 700; }
      .ppt-font-cn-body { font-family: 'HarmonyOS Sans SC', sans-serif; font-weight: 400; }
    </style>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"></feGaussianBlur>
      <feOffset dx="0" dy="4" result="offsetblur"></feOffset>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"></feFuncA>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    <linearGradient id="grad-gold-premium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"></stop>
      <stop offset="100%" stop-color="#F59E0B"></stop>
    </linearGradient>
  </defs>

  <!-- LAYER 1: Background -->
  <g id="bg">
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5E5E5" stroke-width="0.5"></path>
      </pattern>
      <radialGradient id="glow" cx="90%" cy="90%" r="50%">
        <stop offset="0%" stop-color="#FF6700" stop-opacity="0.08"></stop>
        <stop offset="100%" stop-color="#FF6700" stop-opacity="0"></stop>
      </radialGradient>
    </defs>
    <rect width="100%" height="100%" fill="#F8F9FA"></rect>
    <rect width="100%" height="100%" fill="url(#grid)"></rect>
    <rect width="100%" height="100%" fill="url(#glow)"></rect>
  </g>

  <!-- LAYER 2: Content Layer -->
  <g id="content_layer">
    <!-- Card 1: Scale Leap -->
    <g transform="translate(40, 110)" filter="url(#card-shadow)">
      <rect width="590" height="280" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"></rect>
      <rect x="24" y="24" width="4" height="20" rx="2" fill="#FF6700"></rect>
      <text class="ppt-font-cn-heading" x="36" y="41" font-size="22" fill="#1A1A1A">规模跨越：单季交付破10万</text>
      <text class="ppt-font-cn-body" x="24" y="72" font-size="14" fill="#6B7280">2025年Q3交付量对比 (单位：辆)</text>
      
      <!-- Growth Badge -->
      <rect x="470" y="24" width="96" height="28" rx="14" fill="#ECFDF5"></rect>
      <text class="ppt-font-cn-heading" x="518" y="43" text-anchor="middle" font-size="14" fill="#059669">+173.4%</text>

      <!-- Chart Slot -->
      <g data-chart-slot-id="chart-交付对比" data-chart-type="bar" transform="translate(24, 90)"><rect x="0.5" y="0.5" width="540" height="158" rx="7.5" fill="none" stroke="#E5E5E5" stroke-width="1"></rect><line x1="50" y1="119" x2="521" y2="119" stroke="#EEEEEE" stroke-width="1" stroke-dasharray="0"></line><text x="38" y="123" text-anchor="end" font-size="11" fill="#64748B" opacity="0.8" font-weight="500">0</text><line x1="50" y1="101.2" x2="521" y2="101.2" stroke="#EEEEEE" stroke-width="1" stroke-dasharray="0"></line><text x="38" y="105.2" text-anchor="end" font-size="11" fill="#64748B" opacity="0.8" font-weight="500">50000</text><line x1="50" y1="83.4" x2="521" y2="83.4" stroke="#EEEEEE" stroke-width="1" stroke-dasharray="0"></line><text x="38" y="87.4" text-anchor="end" font-size="11" fill="#64748B" opacity="0.8" font-weight="500">100000</text><line x1="50" y1="65.6" x2="521" y2="65.6" stroke="#EEEEEE" stroke-width="1" stroke-dasharray="0"></line><text x="38" y="69.6" text-anchor="end" font-size="11" fill="#64748B" opacity="0.8" font-weight="500">150000</text><line x1="50" y1="47.8" x2="521" y2="47.8" stroke="#EEEEEE" stroke-width="1" stroke-dasharray="0"></line><text x="38" y="51.8" text-anchor="end" font-size="11" fill="#64748B" opacity="0.8" font-weight="500">200000</text><line x1="50" y1="30" x2="521" y2="30" stroke="#EEEEEE" stroke-width="1" stroke-dasharray="0"></line><text x="38" y="34" text-anchor="end" font-size="11" fill="#64748B" opacity="0.8" font-weight="500">250000</text><path d="M 56 119 L 56 108.83476 A 4 4 0 0 1 60 104.83476 L 275.5 104.83476 A 4 4 0 0 1 279.5 108.83476 L 279.5 119 Z" fill="#FF6700"></path><text x="167.75" y="96.83476" text-anchor="middle" font-size="14" fill="#1A1A1A" font-weight="600">39790辆</text><text x="167.75" y="143" text-anchor="middle" font-size="13" fill="#64748B" font-weight="500">2024 Q3</text><path d="M 291.5 119 L 291.5 84.26862399999999 A 4 4 0 0 1 295.5 80.26862399999999 L 511 80.26862399999999 A 4 4 0 0 1 515 84.26862399999999 L 515 119 Z" fill="#333333"></path><text x="403.25" y="72.26862399999999" text-anchor="middle" font-size="14" fill="#1A1A1A" font-weight="600">108796辆</text><text x="403.25" y="143" text-anchor="middle" font-size="13" fill="#64748B" font-weight="500">2025 Q3</text><line x1="42" y1="119" x2="521" y2="119" stroke="#CCCCCC" stroke-width="1" stroke-linecap="round"></line><line x1="50" y1="30" x2="50" y2="127" stroke="#CCCCCC" stroke-width="1" stroke-linecap="round"></line></g>
    </g>

    <!-- Card 2: Image Hero -->
    <g transform="translate(650, 110)" filter="url(#card-shadow)">
      <image id="ai-image-img-yu7-hero" data-ai-slot-id="img-yu7-hero" x="0" y="0" width="590" height="280" href="https://aiphoto.sandunppt.com/public/uploads/superppt/replace/2026/03/24/aedeab4b-9658-b6b1-d33b-55c1895bed09/manual_c858f159ce26.jpg" data-source-url="https://images.unsplash.com/photo-1773414422120-3a8b1c07fee6?crop=entropy&amp;amp;amp;amp;amp;cs=tinysrgb&amp;amp;amp;amp;amp;fit=max&amp;amp;amp;amp;amp;fm=jpg&amp;amp;amp;amp;amp;ixid=M3w4ODI2MTl8MHwxfHNlYXJjaHwxfHxtb2Rlcm4lMjBsdXh1cnklMjBlbGVjdHJpYyUyMHN1diUyMHhpYW9taSUyMHl1NyUyMHNpbHZlciUyMG1ldGFsbGljfGVufDB8fHx8MTc3NDMzMjI0Nnww&amp;amp;amp;amp;amp;ixlib=rb-4.1.0&amp;amp;amp;amp;amp;q=80&amp;amp;amp;amp;amp;w=1080" preserveAspectRatio="xMidYMid slice"><title>https://images.unsplash.com/photo-1773414422120-3a8b1c07fee6?crop=entropy&amp;amp;cs=tinysrgb&amp;amp;fit=max&amp;amp;fm=jpg&amp;amp;ixid=M3w4ODI2MTl8MHwxfHNlYXJjaHwxfHxtb2Rlcm4lMjBsdXh1cnklMjBlbGVjdHJpYyUyMHN1diUyMHhpYW9taSUyMHl1NyUyMHNpbHZlciUyMG1ldGFsbGljfGVufDB8fHx8MTc3NDMzMjI0Nnww&amp;amp;ixlib=rb-4.1.0&amp;amp;q=80&amp;amp;w=1080</title></image>
    </g>

    <!-- Card 3: Category King -->
    <g transform="translate(40, 410)" filter="url(#card-shadow)">
      <rect width="380" height="270" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"></rect>
      <text class="ppt-font-cn-heading" x="24" y="40" font-size="22" fill="#1A1A1A">品类之王</text>
      
      <!-- Premium Badge Visual -->
      <circle cx="190" cy="135" r="65" fill="url(#grad-gold-premium)" opacity="0.1"></circle>
      <text class="ppt-font-cn-heading" x="190" y="155" text-anchor="middle" font-size="80" fill="#D97706">NO.1</text>
      
      <text class="ppt-font-cn-heading" x="190" y="225" text-anchor="middle" font-size="18" fill="#374151">2025年10月中国 SUV 销量冠军</text>
      <text class="ppt-font-cn-body" x="190" y="250" text-anchor="middle" font-size="14" fill="#9CA3AF">Xiaomi YU7 发布即爆款</text>
    </g>

    <!-- Card 4: Value Transition -->
    <g transform="translate(440, 410)" filter="url(#card-shadow)">
      <rect width="800" height="270" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"></rect>
      <text class="ppt-font-cn-heading" x="30" y="40" font-size="22" fill="#1A1A1A">价值跃迁：高端化成效显著</text>
      
      <!-- Revenue Dashboard -->
      <g transform="translate(30, 85)">
        <text class="ppt-font-cn-body" x="0" y="20" font-size="16" fill="#6B7280">汽车业务总收入</text>
        <text class="ppt-font-cn-heading" x="0" y="70" font-size="52" fill="#FF6700">283 <tspan font-size="24" dy="-2">亿元</tspan></text>
        <rect x="0" y="95" width="130" height="30" rx="6" fill="#FFF7ED"></rect>
        <text class="ppt-font-cn-heading" x="65" y="115" text-anchor="middle" font-size="15" fill="#C2410C">同比 +197.9%</text>
      </g>

      <!-- Vertical Divider -->
      <line x1="380" y1="80" x2="380" y2="230" stroke="#F3F4F6" stroke-width="2"></line>

      <!-- ASP Dashboard -->
      <g transform="translate(430, 85)">
        <text class="ppt-font-cn-body" x="0" y="20" font-size="16" fill="#6B7280">平均售价 (ASP)</text>
        <text class="ppt-font-cn-heading" x="0" y="70" font-size="52" fill="#1A1A1A">￥260,053</text>
        <text class="ppt-font-cn-body" x="0" y="105" font-size="15" fill="#4B5563">由 YU7 与 SU7 Ultra 强力驱动品牌溢价</text>
        
        <!-- Progress Bar Visual -->
        <rect x="0" y="135" width="320" height="10" rx="5" fill="#F3F4F6"></rect>
        <rect x="0" y="135" width="260" height="10" rx="5" fill="#FF6700"></rect>
        <text class="ppt-font-cn-body" x="0" y="165" font-size="12" fill="#9CA3AF">高端产品占比持续攀升</text>
      </g>
    </g>
  </g>

  <!-- LAYER 3: Header Layer -->
  <g id="header">
    <rect x="40" y="46" width="6" height="26" rx="3" fill="#FF6700"></rect>
    <text x="58" y="66" class="ppt-font-cn-heading" font-size="26" fill="#1A1A1A">交付与产品：Xiaomi YU7 领跑 SUV 市场</text>
  </g>

  <g id="ai-image-layer">
    <clipPath id="clip-ai-image-img-yu7-hero">
      <rect x="0.00" y="0.00" width="590.00" height="280.00" rx="12"></rect>
    </clipPath>
    
  </g>
</svg>