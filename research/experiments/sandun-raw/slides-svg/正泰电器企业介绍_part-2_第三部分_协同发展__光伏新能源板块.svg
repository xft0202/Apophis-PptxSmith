<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style><![CDATA[
      @import url("https://content-sandunppt.oss-cn-guangzhou.aliyuncs.com/fonts/HarmonyOS_Sans_SC_Bold/result.css");
      @import url("https://content-sandunppt.oss-cn-guangzhou.aliyuncs.com/fonts/HarmonyOS_Sans_SC_Regular/result.css");
      .ppt-font-cn-heading { font-family: 'HarmonyOS Sans SC'; font-weight: 700; }
      .ppt-font-cn-body { font-family: 'HarmonyOS Sans SC'; font-weight: 400; }
    ]]></style>
    <linearGradient id="text_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="text_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
      <feOffset dx="0" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- LAYER 1: Background (Eco-Fluid Design System) -->
  <g id="bg">
    <defs>
      <linearGradient id="eco_grad_bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F0FDF4" />
        <stop offset="100%" stop-color="#FFFFFF" />
      </linearGradient>
      <filter id="blur_blob_bg">
        <feGaussianBlur in="SourceGraphic" stdDeviation="60" result="blur" />
      </filter>
    </defs>
    <rect width="100%" height="100%" fill="url(#eco_grad_bg)" />
    <circle cx="10%" cy="20%" r="300" fill="#DCFCE7" filter="url(#blur_blob_bg)" opacity="0.6" />
    <circle cx="90%" cy="80%" r="400" fill="#F0FDFA" filter="url(#blur_blob_bg)" opacity="0.8" />
    <path d="M0 0 Q480 20 960 0 T1920 0" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.2" />
  </g>

  <!-- LAYER 2: Content (Transition Page Layout) -->
  <g id="content_layer">
    <!-- Giant Chapter Number (Background Decorative) -->
    <text x="1150" y="650" font-size="420" fill="#10B981" text-anchor="end" class="ppt-font-cn-heading" opacity="0.08">03</text>
    
    <!-- Decorative Elements -->
    <rect x="100" y="280" width="4" height="120" rx="2" fill="#10B981" />
    <circle cx="102" cy="280" r="6" fill="#064E3B" />
    
    <!-- Part Label -->
    <text x="124" y="296" font-size="24" fill="#10B981" letter-spacing="4" class="ppt-font-cn-heading">PART 03</text>
    
    <!-- Main Title -->
    <text x="124" y="380" font-size="76" fill="#064E3B" filter="url(#text_shadow)" class="ppt-font-cn-heading">协同发展——光伏新能源板块</text>
    
    <!-- Decorative Accent Line -->
    <rect x="124" y="415" width="120" height="6" rx="3" fill="url(#text_grad)" />
    
    <!-- Subtitle -->
    <text x="124" y="470" font-size="30" fill="#1F2937" class="ppt-font-cn-body">驱动发储配用全场景融合创新</text>
    <text x="124" y="515" font-size="30" fill="#1F2937" class="ppt-font-cn-body">助力全球能源结构转型与双碳目标实现</text>
    
    <!-- Description -->
    <g opacity="0.7">
        <rect x="124" y="560" width="800" height="1" fill="#10B981" opacity="0.3" />
        <text x="124" y="600" font-size="20" fill="#4B5563" class="ppt-font-cn-body">展示正泰在光伏电站、储能系统及户用光伏等领域的全方位布局与前沿技术应用。</text>
    </g>

    <!-- Floating Eco Particles -->
    <circle cx="1100" cy="150" r="40" fill="none" stroke="#10B981" stroke-width="2" opacity="0.2" />
    <circle cx="1150" cy="180" r="15" fill="#10B981" opacity="0.1" />
    <path d="M1050 100 Q1100 150 1050 200" fill="none" stroke="#10B981" stroke-width="1" opacity="0.3" />
  </g>

  <!-- NO Header for Transition Page as per Rendering Logic Step 3 -->
</svg>