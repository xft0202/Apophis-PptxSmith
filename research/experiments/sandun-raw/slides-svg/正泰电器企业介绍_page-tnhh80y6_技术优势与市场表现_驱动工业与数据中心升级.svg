<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720">
  <defs>
    <style><![CDATA[
      @import url("https://content-sandunppt.oss-cn-guangzhou.aliyuncs.com/fonts/HarmonyOS_Sans_SC_Bold/result.css");
      @import url("https://content-sandunppt.oss-cn-guangzhou.aliyuncs.com/fonts/HarmonyOS_Sans_SC_Regular/result.css");
      @import url("https://content-sandunppt.oss-cn-guangzhou.aliyuncs.com/fonts/SourceHanSerifCN-Bold/result.css");
      .ppt-font-cn-heading { font-family: 'HarmonyOS Sans SC'; font-weight: 700; }
      .ppt-font-cn-body { font-family: 'HarmonyOS Sans SC'; font-weight: 400; }
      .ppt-font-cn-theme-heritage { font-family: 'Source Han Serif CN'; font-weight: 700; }
    ]]></style>
    <filter id="card_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#064E3B" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- LAYER 1: Background -->
  <g id="bg">
    <defs>
      <linearGradient id="eco_grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F0FDF4"/>
        <stop offset="100%" stop-color="#FFFFFF"/>
      </linearGradient>
      <filter id="blur_blob">
        <feGaussianBlur in="SourceGraphic" stdDeviation="60" result="blur"/>
      </filter>
    </defs>
    <rect width="100%" height="100%" fill="url(#eco_grad)"/>
    <circle cx="10%" cy="20%" r="300" fill="#DCFCE7" filter="url(#blur_blob)" opacity="0.6"/>
    <circle cx="90%" cy="80%" r="400" fill="#F0FDFA" filter="url(#blur_blob)" opacity="0.8"/>
    <path d="M0 0 Q480 20 960 0 T1920 0" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.2"/>
  </g>

  <!-- LAYER 2: Content Layer -->
  <g id="content_layer">
    <!-- Module 1: Core Technology -->
    <g transform="translate(40, 100)">
      <rect width="680" height="340" rx="16" fill="#FFFFFF" fill-opacity="0.9" stroke="#10B981" stroke-width="0.5" filter="url(#card_shadow)"/>
      <text class="ppt-font-cn-heading" x="24" y="40" font-size="22" fill="#064E3B">从“工程”到“产品”：预制化电力模块</text>
      <text class="ppt-font-cn-body" x="24" y="70" font-size="14" fill="#059669">高度集成 (All-in-One) · 2.4MW 最大负载 · 乐高式安装</text>
      
      <!-- Image Slot img-1 -->
      <image id="ai-image-img-1" data-ai-slot-id="img-1" x="0" y="0" width="360" height="220" href="https://aiphoto.sandunppt.com/public/uploads/superppt/slot-gen/2026/03/24/img-1_dab40135cd9a.png" data-source-url="https://aiphoto.sandunppt.com/public/uploads/superppt/slot-gen/2026/03/24/img-1_dab40135cd9a.png" preserveAspectRatio="xMidYMid slice" transform="translate(24, 90)"><title>https://aiphoto.sandunppt.com/public/uploads/superppt/slot-gen/2026/03/24/img-1_dab40135cd9a.png</title></image>

      <!-- Tech Specs -->
      <g transform="translate(400, 100)">
        <circle cx="10" cy="10" r="4" fill="#10B981"/>
        <text class="ppt-font-cn-body" x="24" y="15" font-size="15" fill="#374151">10kV 配电集成</text>
        <circle cx="10" cy="45" r="4" fill="#10B981"/>
        <text class="ppt-font-cn-body" x="24" y="50" font-size="15" fill="#374151">变压器与 UPS 单元</text>
        <circle cx="10" cy="80" r="4" fill="#10B981"/>
        <text class="ppt-font-cn-body" x="24" y="85" font-size="15" fill="#374151">输出配电模块</text>
        
        <rect x="0" y="115" width="256" height="105" rx="12" fill="#DCFCE7" fill-opacity="0.6"/>
        <text class="ppt-font-cn-heading" x="16" y="145" font-size="18" fill="#065F46">即插即用</text>
        <text class="ppt-font-cn-body" x="16" y="175" font-size="13" fill="#065F46" opacity="0.9">工厂全预装，现场极简安装</text>
        <text class="ppt-font-cn-body" x="16" y="195" font-size="13" fill="#065F46" opacity="0.9">大幅减少现场动火与接线</text>
      </g>
    </g>

    <!-- Module 2: Efficiency Data -->
    <g transform="translate(740, 100)">
      <rect width="500" height="340" rx="16" fill="#FFFFFF" fill-opacity="0.9" stroke="#10B981" stroke-width="0.5" filter="url(#card_shadow)"/>
      <text class="ppt-font-cn-heading" x="24" y="40" font-size="22" fill="#064E3B">极致能效与敏捷交付</text>
      <text class="ppt-font-cn-heading" x="24" y="85" font-size="48" fill="#10B981">98% <tspan font-size="18" fill="#6B7280" font-weight="400">超高运行效率</tspan></text>
      
      <!-- Chart Slot chart-1 -->
      <g data-chart-slot-id="chart-1" data-chart-type="bar" transform="translate(24, 125)"><rect x="0.75" y="0.75" width="450.5" height="178.5" rx="19.25" fill="none" stroke="#DCFCE7" stroke-width="1.5"/><line x1="50" y1="140" x2="432" y2="140" stroke="#F0FDF4" stroke-width="1" stroke-dasharray="4 4"/><text x="38" y="144" text-anchor="end" font-size="11" fill="#64748B" opacity="0.8" font-weight="500">0</text><line x1="50" y1="118" x2="432" y2="118" stroke="#F0FDF4" stroke-width="1" stroke-dasharray="4 4"/><text x="38" y="122" text-anchor="end" font-size="11" fill="#64748B" opacity="0.8" font-weight="500">20</text><line x1="50" y1="96" x2="432" y2="96" stroke="#F0FDF4" stroke-width="1" stroke-dasharray="4 4"/><text x="38" y="100" text-anchor="end" font-size="11" fill="#64748B" opacity="0.8" font-weight="500">40</text><line x1="50" y1="74" x2="432" y2="74" stroke="#F0FDF4" stroke-width="1" stroke-dasharray="4 4"/><text x="38" y="78" text-anchor="end" font-size="11" fill="#64748B" opacity="0.8" font-weight="500">60</text><line x1="50" y1="52" x2="432" y2="52" stroke="#F0FDF4" stroke-width="1" stroke-dasharray="4 4"/><text x="38" y="56" text-anchor="end" font-size="11" fill="#64748B" opacity="0.8" font-weight="500">80</text><line x1="50" y1="30" x2="432" y2="30" stroke="#F0FDF4" stroke-width="1" stroke-dasharray="4 4"/><text x="38" y="34" text-anchor="end" font-size="11" fill="#64748B" opacity="0.8" font-weight="500">100</text><path d="M 56 140 L 56 106 A 10 10 0 0 1 66 96 L 129.5 96 A 10 10 0 0 1 139.5 106 L 139.5 140 Z" fill="#10B981"/><text x="97.75" y="88" text-anchor="middle" font-size="14" fill="#064E3B" font-weight="600">40%</text><text x="97.75" y="164" text-anchor="middle" font-size="13" fill="#64748B" font-weight="500">交付缩短</text><path d="M 151.5 140 L 151.5 95 A 10 10 0 0 1 161.5 85 L 225 85 A 10 10 0 0 1 235 95 L 235 140 Z" fill="#34D399"/><text x="193.25" y="77" text-anchor="middle" font-size="14" fill="#064E3B" font-weight="600">50%</text><text x="193.25" y="164" text-anchor="middle" font-size="13" fill="#64748B" font-weight="500">空间节省</text><path d="M 247 140 L 247 76.63 A 10 10 0 0 1 257 66.63 L 320.5 66.63 A 10 10 0 0 1 330.5 76.63 L 330.5 140 Z" fill="#059669"/><text x="288.75" y="58.629999999999995" text-anchor="middle" font-size="14" fill="#064E3B" font-weight="600">66.7%</text><text x="288.75" y="164" text-anchor="middle" font-size="13" fill="#64748B" font-weight="500">损耗降低</text><path d="M 342.5 140 L 342.5 128 A 10 10 0 0 1 352.5 118 L 416 118 A 10 10 0 0 1 426 128 L 426 140 Z" fill="#F59E0B"/><text x="384.25" y="110" text-anchor="middle" font-size="14" fill="#064E3B" font-weight="600">20%</text><text x="384.25" y="164" text-anchor="middle" font-size="13" fill="#64748B" font-weight="500">投资减少</text><line x1="42" y1="140" x2="432" y2="140" stroke="#A7F3D0" stroke-width="1.2" stroke-linecap="round"/><line x1="50" y1="30" x2="50" y2="148" stroke="#A7F3D0" stroke-width="1.2" stroke-linecap="round"/></g>
    </g>

    <!-- Module 3: Market & Customers -->
    <g transform="translate(40, 460)">
      <rect width="860" height="220" rx="16" fill="#FFFFFF" fill-opacity="0.9" stroke="#10B981" stroke-width="0.5" filter="url(#card_shadow)"/>
      <text class="ppt-font-cn-heading" x="24" y="40" font-size="22" fill="#064E3B">全球头部客户的共同选择</text>
      
      <g transform="translate(24, 65)">
        <!-- Row 1 -->
        <rect x="0" y="0" width="180" height="50" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <text class="ppt-font-cn-heading" x="90" y="32" text-anchor="middle" font-size="16" fill="#334155">阿里巴巴</text>
        
        <rect x="200" y="0" width="180" height="50" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <text class="ppt-font-cn-heading" x="290" y="32" text-anchor="middle" font-size="16" fill="#334155">腾讯</text>
        
        <rect x="400" y="0" width="180" height="50" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <text class="ppt-font-cn-heading" x="490" y="32" text-anchor="middle" font-size="16" fill="#334155">中国移动</text>
        
        <rect x="600" y="0" width="180" height="50" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <text class="ppt-font-cn-heading" x="690" y="32" text-anchor="middle" font-size="16" fill="#334155">中国电信</text>

        <!-- Row 2 -->
        <rect x="0" y="70" width="180" height="50" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <text class="ppt-font-cn-heading" x="90" y="102" text-anchor="middle" font-size="16" fill="#334155">普洛斯 GLP</text>
        
        <rect x="200" y="70" width="180" height="50" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <text class="ppt-font-cn-heading" x="290" y="102" text-anchor="middle" font-size="16" fill="#334155">中国联通</text>
        
        <rect x="400" y="70" width="412" height="50" rx="10" fill="#DCFCE7" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
        <text class="ppt-font-cn-body" x="606" y="102" text-anchor="middle" font-size="14" fill="#065F46">典型案例：马尼拉大型数据中心 | 上海绿色边缘中心</text>
      </g>
      
      <text class="ppt-font-cn-body" x="24" y="200" font-size="13" fill="#64748B">覆盖互联网巨头、顶级运营商及全球绿色能源标杆项目</text>
    </g>

    <!-- Module 4: Authority -->
    <g transform="translate(920, 460)">
      <rect width="320" height="220" rx="16" fill="#064E3B" filter="url(#card_shadow)"/>
      <text class="ppt-font-cn-heading" x="24" y="40" font-size="20" fill="#F0FDF4">行业标准定义者</text>
      
      <rect x="24" y="65" width="272" height="1" fill="#10B981" fill-opacity="0.3"/>
      
      <text class="ppt-font-cn-heading" x="24" y="95" font-size="18" fill="#34D399">T/DZJN 101-2022</text>
      <text class="ppt-font-cn-body" x="24" y="125" font-size="14" fill="#D1FAE5">核心起草单位</text>
      <text class="ppt-font-cn-body" x="24" y="150" font-size="13" fill="#A7F3D0" opacity="0.8">《数据中心电力模块预制化技术规范》</text>
      
      <g transform="translate(24, 175)">
        <rect width="125" height="28" rx="6" fill="#065F46"/>
        <text class="ppt-font-cn-body" x="62.5" y="19" text-anchor="middle" font-size="12" fill="#F0FDF4">权威机构认证</text>
        <rect x="135" y="0" width="100" height="28" rx="6" fill="#065F46"/>
        <text class="ppt-font-cn-body" x="185" y="19" text-anchor="middle" font-size="12" fill="#F0FDF4">全系列覆盖</text>
      </g>
    </g>
  </g>

  <!-- LAYER 3: Header -->
  <g id="header">
    <circle cx="44" cy="60" r="6" fill="#10B981"/>
    <text class="ppt-font-cn-heading" x="58" y="66" font-size="26" fill="#064E3B">技术优势与市场表现：驱动工业与数据中心升级</text>
  </g>

  <g id="ai-image-layer">
    <clipPath id="clip-ai-image-img-1">
      <rect x="24.00" y="90.00" width="360.00" height="220.00" rx="12"/>
    </clipPath>
    
  </g>
</svg>