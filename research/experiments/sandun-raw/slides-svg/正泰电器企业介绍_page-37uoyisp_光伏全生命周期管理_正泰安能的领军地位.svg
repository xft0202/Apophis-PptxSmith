<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720"><style data-img-radius="1">image{clip-path:inset(0 round 8px)}</style>
  <defs>
    <style>
      @import url("https://content-sandunppt.oss-cn-guangzhou.aliyuncs.com/fonts/HarmonyOS_Sans_SC_Bold/result.css");
      @import url("https://content-sandunppt.oss-cn-guangzhou.aliyuncs.com/fonts/HarmonyOS_Sans_SC_Regular/result.css");
      .ppt-font-cn-heading { font-family: 'HarmonyOS Sans SC'; font-weight: 700; }
      .ppt-font-cn-body { font-family: 'HarmonyOS Sans SC'; font-weight: 400; }
      .card-shadow { filter: drop-shadow(0 8px 15px rgba(16, 185, 129, 0.08)); }
      .accent-grad { fill: url(#green_grad); }
    </style>
    
    <!-- Design System Background Elements -->
    <linearGradient id="eco_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"></stop>
      <stop offset="100%" stop-color="#FFFFFF"></stop>
    </linearGradient>
    <filter id="blur_blob"><feGaussianBlur in="SourceGraphic" stdDeviation="60" result="blur"></feGaussianBlur></filter>
    
    <!-- Theme Gradients -->
    <linearGradient id="green_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"></stop>
      <stop offset="100%" stop-color="#059669"></stop>
    </linearGradient>

    <marker id="arrowhead-eco" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10B981"></polygon>
    </marker>
  </defs>

  <!-- LAYER 1: Background -->
  <g id="bg">
    <rect width="100%" height="100%" fill="url(#eco_grad)"></rect>
    <circle cx="10%" cy="20%" r="300" fill="#DCFCE7" filter="url(#blur_blob)" opacity="0.6"></circle>
    <circle cx="90%" cy="80%" r="400" fill="#F0FDFA" filter="url(#blur_blob)" opacity="0.8"></circle>
    <path d="M0 0 Q480 20 960 0 T1920 0" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.2"></path>
  </g>

  <!-- LAYER 2: Content Layer -->
  <g id="content_layer">
    
    <!-- Module 1: Market Leadership (Top Left) -->
    <g transform="translate(40, 100)">
      <rect width="420" height="280" rx="20" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="1.5" class="card-shadow"></rect>
      <rect x="24" y="24" width="4" height="20" rx="2" fill="#10B981"></rect>
      <text class="ppt-font-cn-heading" x="36" y="42" font-size="22" fill="#064E3B">户用光伏领域绝对领军</text>
      <text class="ppt-font-cn-body" x="36" y="70" font-size="14" fill="#6B7280">市占率对比 (行业 NO.1)</text>
      
      <!-- Chart Slot -->
      <g xmlns="http://www.w3.org/2000/svg" data-chart-slot-id="chart-1" data-chart-type="bar" transform="translate(24, 90)"><rect x="0" y="0" width="370" height="160" rx="20" fill="#FFFFFF"></rect><rect x="0.75" y="0.75" width="368.5" height="158.5" rx="19.25" fill="none" stroke="#DCFCE7" stroke-width="1.5"></rect><line x1="50" y1="120" x2="350" y2="120" stroke="#F0FDF4" stroke-width="1" stroke-dasharray="4 4"></line><text x="38" y="124" text-anchor="end" font-size="10" fill="#64748B" opacity="0.8" font-weight="500">0</text><line x1="50" y1="102" x2="350" y2="102" stroke="#F0FDF4" stroke-width="1" stroke-dasharray="4 4"></line><text x="38" y="106" text-anchor="end" font-size="10" fill="#64748B" opacity="0.8" font-weight="500">10</text><line x1="50" y1="84" x2="350" y2="84" stroke="#F0FDF4" stroke-width="1" stroke-dasharray="4 4"></line><text x="38" y="88" text-anchor="end" font-size="10" fill="#64748B" opacity="0.8" font-weight="500">20</text><line x1="50" y1="66" x2="350" y2="66" stroke="#F0FDF4" stroke-width="1" stroke-dasharray="4 4"></line><text x="38" y="70" text-anchor="end" font-size="10" fill="#64748B" opacity="0.8" font-weight="500">30</text><line x1="50" y1="48" x2="350" y2="48" stroke="#F0FDF4" stroke-width="1" stroke-dasharray="4 4"></line><text x="38" y="52" text-anchor="end" font-size="10" fill="#64748B" opacity="0.8" font-weight="500">40</text><line x1="50" y1="30" x2="350" y2="30" stroke="#F0FDF4" stroke-width="1" stroke-dasharray="4 4"></line><text x="38" y="34" text-anchor="end" font-size="10" fill="#64748B" opacity="0.8" font-weight="500">50</text><path d="M 56 120 L 56 75.1 A 10 10 0 0 1 66 65.1 L 109 65.1 A 10 10 0 0 1 119 75.1 L 119 120 Z" fill="#10B981"></path><text x="87.5" y="57.099999999999994" text-anchor="middle" font-size="14" fill="#064E3B" font-weight="600">30.5%</text><text x="87.5" y="144" text-anchor="middle" font-size="12" fill="#64748B" font-weight="500">正泰安能</text><path d="M 131 120 L 131 108.03999999999999 A 10 10 0 0 1 141 98.03999999999999 L 184 98.03999999999999 A 10 10 0 0 1 194 108.03999999999999 L 194 120 Z" fill="#34D399"></path><text x="162.5" y="90.03999999999999" text-anchor="middle" font-size="14" fill="#064E3B" font-weight="600">12.2%</text><text x="162.5" y="144" text-anchor="middle" font-size="12" fill="#64748B" font-weight="500">企业B</text><path d="M 206 120 L 206 114.7 A 10 10 0 0 1 216 104.7 L 259 104.7 A 10 10 0 0 1 269 114.7 L 269 120 Z" fill="#059669"></path><text x="237.5" y="96.7" text-anchor="middle" font-size="14" fill="#064E3B" font-weight="600">8.5%</text><text x="237.5" y="144" text-anchor="middle" font-size="12" fill="#64748B" font-weight="500">企业C</text><path d="M 281 120 L 281 42.16 A 10 10 0 0 1 291 32.16 L 334 32.16 A 10 10 0 0 1 344 42.16 L 344 120 Z" fill="#F59E0B"></path><text x="312.5" y="24.159999999999997" text-anchor="middle" font-size="14" fill="#064E3B" font-weight="600">48.8%</text><text x="312.5" y="144" text-anchor="middle" font-size="12" fill="#64748B" font-weight="500">其他</text><line x1="42" y1="120" x2="350" y2="120" stroke="#A7F3D0" stroke-width="1.2" stroke-linecap="round"></line><line x1="50" y1="30" x2="50" y2="128" stroke="#A7F3D0" stroke-width="1.2" stroke-linecap="round"></line></g>
    </g>

    <!-- Module 1 Impact: 1/4 Choice (Top Middle) -->
    <g transform="translate(480, 100)">
      <rect width="380" height="280" rx="20" fill="url(#green_grad)" class="card-shadow"></rect>
      <text class="ppt-font-cn-heading" x="30" y="50" font-size="24" fill="#FFFFFF">1/4 的家庭选择</text>
      <text class="ppt-font-cn-body" x="30" y="82" font-size="14" fill="#D1FAE5">全国每 4 户建站家庭，就有 1 户选择正泰安能</text>
      
      <text class="ppt-font-cn-heading" x="30" y="165" font-size="56" fill="#FFFFFF">150万+</text>
      <text class="ppt-font-cn-body" x="30" y="195" font-size="16" fill="#D1FAE5">累计服务用户 (户)</text>
      
      <line x1="30" y1="220" x2="350" y2="220" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"></line>
      <text class="ppt-font-cn-body" x="30" y="250" font-size="14" fill="#FFFFFF">覆盖 29 省份 | 1800+ 区县 | 2800+ 代理商</text>
    </g>

    <!-- Module 3 Image: Innovation (Top Right) -->
    <g transform="translate(880, 100)">
      <rect width="360" height="280" rx="20" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="1.5" class="card-shadow"></rect>
      <text class="ppt-font-cn-heading" x="24" y="42" font-size="20" fill="#064E3B">模式创新：整村开发</text>
      
      <!-- Image Slot -->
      <image xmlns="http://www.w3.org/2000/svg" id="ai-image-img-1" data-ai-slot-id="img-1" x="0" y="0" width="320" height="150" href="https://aiphoto.sandunppt.com/public/uploads/superppt/slot-gen/2026/03/24/img-1_281ee41054ee.png" data-source-url="https://aiphoto.sandunppt.com/public/uploads/superppt/slot-gen/2026/03/24/img-1_281ee41054ee.png" preserveAspectRatio="xMidYMid slice" transform="translate(20, 60)"><title>https://aiphoto.sandunppt.com/public/uploads/superppt/slot-gen/2026/03/24/img-1_281ee41054ee.png</title></image>
      
      <g transform="translate(24, 230)">
        <circle cx="4" cy="4" r="3" fill="#10B981"></circle>
        <text class="ppt-font-cn-body" x="15" y="9" font-size="13" fill="#374151">集中开发、高压并网，破解消纳难题</text>
        <circle cx="4" cy="28" r="3" fill="#10B981"></circle>
        <text class="ppt-font-cn-body" x="15" y="33" font-size="13" fill="#374151">盘活农村闲置屋顶，实现“光伏共富”</text>
      </g>
    </g>

    <!-- Module 2: Lifecycle Process (Bottom Left) -->
    <g transform="translate(40, 400)">
      <rect width="820" height="280" rx="20" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="1.5" class="card-shadow"></rect>
      <text class="ppt-font-cn-heading" x="24" y="44" font-size="22" fill="#064E3B">数字化全生命周期服务体系</text>
      
      <g transform="translate(40, 90)">
        <!-- Step 1 -->
        <rect x="0" y="0" width="130" height="140" rx="16" fill="#F0FDF4"></rect>
        <text class="ppt-font-cn-heading" x="65" y="40" text-anchor="middle" font-size="16" fill="#059669">前端勘设</text>
        <text class="ppt-font-cn-body" x="65" y="75" text-anchor="middle" font-size="14" fill="#065F46">精准勘测</text>
        <text class="ppt-font-cn-body" x="65" y="105" text-anchor="middle" font-size="14" fill="#065F46">差异化方案</text>
        
        <path d="M140 70 L160 70" stroke="#10B981" stroke-width="2" marker-end="url(#arrowhead-eco)"></path>
        
        <!-- Step 2 -->
        <rect x="170" y="0" width="130" height="140" rx="16" fill="#F0FDF4"></rect>
        <text class="ppt-font-cn-heading" x="235" y="40" text-anchor="middle" font-size="16" fill="#059669">中端交付</text>
        <text class="ppt-font-cn-body" x="235" y="75" text-anchor="middle" font-size="14" fill="#065F46">标准化安装</text>
        <text class="ppt-font-cn-body" x="235" y="105" text-anchor="middle" font-size="14" fill="#065F46">极速并网</text>
        
        <path d="M310 70 L330 70" stroke="#10B981" stroke-width="2" marker-end="url(#arrowhead-eco)"></path>
        
        <!-- Step 3 -->
        <rect x="340" y="0" width="130" height="140" rx="16" fill="#F0FDF4"></rect>
        <text class="ppt-font-cn-heading" x="405" y="40" text-anchor="middle" font-size="16" fill="#059669">后端运维</text>
        <text class="ppt-font-cn-body" x="405" y="75" text-anchor="middle" font-size="14" fill="#065F46">小安到家</text>
        <text class="ppt-font-cn-body" x="405" y="105" text-anchor="middle" font-size="14" fill="#065F46">智慧监控</text>
        
        <path d="M480 70 L500 70" stroke="#10B981" stroke-width="2" marker-end="url(#arrowhead-eco)"></path>
        
        <!-- Step 4 -->
        <rect x="510" y="0" width="230" height="140" rx="16" fill="#059669"></rect>
        <text class="ppt-font-cn-heading" x="625" y="55" text-anchor="middle" font-size="18" fill="#FFFFFF">25年资产价值管理</text>
        <text class="ppt-font-cn-body" x="625" y="95" text-anchor="middle" font-size="14" fill="#D1FAE5">确保电站全生命周期收益</text>
      </g>
      
      <text class="ppt-font-cn-body" x="24" y="255" font-size="13" fill="#9CA3AF">转型路径：从“工程建设”迈向“服务型制造”数字化闭环</text>
    </g>

    <!-- Module 4: Social Value Stats (Bottom Right) -->
    <g transform="translate(880, 400)">
      <rect width="360" height="280" rx="20" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="1.5" class="card-shadow"></rect>
      <text class="ppt-font-cn-heading" x="24" y="44" font-size="22" fill="#064E3B">数说共富与减排</text>
      
      <g transform="translate(24, 75)">
        <g data-ai-group-id="grp-p55hrsmc"><text class="ppt-font-cn-body" x="0" y="0" font-size="14" fill="#6B7280" transform="matrix(1 0 0 1 0 0)">累计装机容量 (截至2025 Q1)</text><text class="ppt-font-cn-heading" x="0" y="35" font-size="32" fill="#10B981" transform="matrix(1 0 0 1 0 0)">21,220 <tspan font-size="18" fill="#10B981">MW</tspan></text></g>
        
        
        <g data-ai-group-id="grp-5y2bawxt" transform="matrix(1 0 0 1 0 -14.3207)"><text class="ppt-font-cn-body" x="0" y="85" font-size="14" fill="#6B7280" transform="matrix(1 0 0 1 0 0)">农民累计增收收益</text><text class="ppt-font-cn-heading" x="0" y="120" font-size="32" fill="#059669" transform="matrix(1 0 0 1 0 0)">46 <tspan font-size="18" fill="#059669">亿元</tspan></text></g>
        
        
        <g data-ai-group-id="grp-0m0509f0" transform="matrix(1 0 0 1 1 -29.636)"><text class="ppt-font-cn-body" x="0" y="170" font-size="14" fill="#6B7280" transform="matrix(1 0 0 1 0 0)">年减排二氧化碳</text><text class="ppt-font-cn-heading" x="0" y="205" font-size="32" fill="#065F46" transform="matrix(1 0 0 1 0 0)">3,600+ <tspan font-size="18" fill="#065F46">万吨</tspan></text></g>
        
      </g>
    </g>
  </g>

  <!-- LAYER 3: Header Layer -->
  <g id="header">
    <circle cx="44" cy="60" r="6" fill="#10B981"></circle>
    <text x="58" y="66" class="ppt-font-cn-heading" font-size="26" fill="#064E3B">光伏全生命周期管理：正泰安能的领军地位</text>
  </g>

  <g id="ai-image-layer">
    <clipPath id="clip-ai-image-img-1">
      <rect x="20.00" y="60.00" width="320.00" height="150.00" rx="12"></rect>
    </clipPath>
    
  </g>
</svg>